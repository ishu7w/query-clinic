name: Query Clinic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-clinic-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: query_clinic
          POSTGRES_PASSWORD: query-clinic-ephemeral
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d query_clinic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Compare on disposable PostgreSQL
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUERY_CLINIC_DATABASE_URL: postgresql://postgres:query-clinic-ephemeral@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/query_clinic
        run: |
          npm run test:native
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            npm run bench:native -- "$BASE_SHA" "$HEAD_SHA"
          else
            npm run bench:native
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: query-clinic-report
          path: report/
          if-no-files-found: error
          retention-days: 7
